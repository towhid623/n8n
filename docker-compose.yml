services:
  n8n:
    build: .
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: "Asia/Dhaka"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "Towhid@123"
      N8N_HOST: "n8n.towhid.net"
      N8N_PORT: "5678"
      TRUST_PROXY: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
